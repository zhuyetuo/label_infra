server {
    listen 8284;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:8283/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 样本扫描这类接口要探测每个新视频文件(ffprobe)，历史文件多时较慢，
        # 默认60s会被nginx自己先掐断，放宽到跟前端的300s超时对齐
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # 狗档案要传视频。nginx 默认只放 1MB 过去，不改这里连照片都传不上
        # （返回 413，前端只能看到一个没头没尾的报错）
        client_max_body_size 600m;
        # 别先把整个视频缓到 nginx 的临时盘再转给后端——直接边收边转，
        # 后端那边本来就是分块落盘的
        proxy_request_buffering off;
    }
}
