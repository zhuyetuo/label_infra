server {
    listen 8284;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 不能被浏览器缓存：它引用的 js/css 文件名带哈希，每次发版都变。
    # 没有这条时浏览器按「最后修改时间」自己猜着缓存，发版后普通刷新还是旧页面，
    # 旧页面去调已经删掉的接口，右上角一直弹 404（2026-11 设备调试页就是这样）
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
    # 带哈希的静态文件内容不会变，可以放心长缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ── 后端：主实例 api，更新时的备用实例 api_b ─────────────────────────────
    # 更新时先换 api_b、再重启 api：api 重启那几秒连不上，nginx 自己转给 api_b，别人感觉不到。
    # 只在「连不上 / 主实例不存在」时转（nginx 自己生成的 502/504）；后端自己返回的 502
    # （比如算法服务出错）原样回给前端——proxy_intercept_errors 默认关，那种不走 error_page，
    # 不会把一个已经做了一半的写操作在备用实例上再做一遍。
    # 用变量 + resolver：每次按名字现查 IP（容器重建后 IP 会变，写死的话 nginx 会一直连旧 IP）
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;

    location /api/ {
        set $api_primary api:8283;
        proxy_pass http://$api_primary;
        proxy_connect_timeout 2s;
        error_page 502 504 = @api_backup;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 样本扫描这类接口要探测每个新视频文件(ffprobe)，历史文件多时较慢，
        # 默认60s会被nginx自己先掐断，放宽到跟前端的300s超时对齐
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # 狗档案要传视频。nginx 默认只放 1MB 过去，不改这里连照片都传不上
        # （返回 413，前端只能看到一个没头没尾的报错）
        client_max_body_size 600m;
        # 别先把整个视频缓到 nginx 的临时盘再转给后端——直接边收边转，
        # 后端那边本来就是分块落盘的
        proxy_request_buffering off;
    }

    location @api_backup {
        set $api_backup api_b:8283;
        proxy_pass http://$api_backup;
        proxy_connect_timeout 2s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 600m;
        proxy_request_buffering off;
    }
}

# ── 视频流单独一个端口（8285）────────────────────────────────────────────
# 网页和接口都在 8284，而 Chrome 对同一个源最多开 6 个连接：工作台循环播放时
# 视频分片一直占着几条，保存起止、列表刷新这些接口就得排队，看着像卡死（2026-11-20）。
# 视频改从这个端口走，接口的连接就不会被视频挤住。
# 前端会把 /api/v1/media/... 换成 http://<同一台机器>:8285/...，见 frontend/src/api/media.ts；
# 换端口的话两边要一起改（compose 里的 MEDIA_PORT）。
server {
    listen 8285;

    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;

    # 只放媒体流，别的路径一概 404，免得这个端口被当成第二个网页入口
    location /api/v1/media/ {
        set $api_primary api:8283;
        proxy_pass http://$api_primary;
        proxy_connect_timeout 2s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 换了个端口就是跨源了：工作台的夜视要把画面画到 canvas 上读亮度，
        # <video crossorigin="anonymous"> 必须拿到这几个头，不然视频直接放不出来
        # 后端自己也配了 CORS：先把它的丢掉，统一由这里回显 Origin，免得同一个头出现两遍
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Headers "Range" always;
        add_header Access-Control-Expose-Headers "Content-Range, Accept-Ranges, Content-Length" always;
        add_header Vary Origin always;
        # 保险：带 Range 的跨源请求个别浏览器版本会先问一句
        if ($request_method = OPTIONS) {
            return 204;
        }
        # 边收边转：视频别先整个缓到 nginx 临时盘再发给浏览器
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        return 404;
    }
}
