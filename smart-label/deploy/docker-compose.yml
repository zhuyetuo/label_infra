# 所有容器时区跟宿主机一致（默认 Asia/Shanghai，.env 里 TZ= 可改）：日志时间、
# MySQL 的 NOW()/created_at、定时任务的调度时间都按这个来，不然全是 UTC 差 8 小时
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-smart_label}
      MYSQL_USER: ${MYSQL_USER:-smart_label}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    # 默认配置是给小机器的：数据缓存（buffer pool）只有 128MB，服务器 60G 内存几乎没用上，
    # 表一大查询就一直读磁盘，页面卡、锁等得久。下面这几项都能在 .env 里改
    command:
      # 数据和索引缓存在内存里：越大越少读磁盘。留够给训练 / 推理（机器 62G，默认给 8G）
      - --innodb-buffer-pool-size=${MYSQL_BUFFER_POOL:-8G}
      # 写日志的容量：大了批量写（AI 预标注一次写几百个任务）不用频繁刷盘
      - --loose-innodb-redo-log-capacity=${MYSQL_REDO_LOG:-2G}
      - --max-connections=${MYSQL_MAX_CONNECTIONS:-500}
      # 等锁最多等这么久（默认 50 秒）：被一个长事务锁住时，后面的请求早点报错，而不是整页转一分钟
      - --innodb-lock-wait-timeout=${MYSQL_LOCK_WAIT:-20}
      # 等表锁（元数据锁，改表结构时会有）最多 60 秒。MySQL 默认等一年：一条 ALTER 卡在那里，
      # 后面所有用这张表的查询都排在它后面，全站卡死
      - --lock-wait-timeout=${MYSQL_MDL_WAIT:-60}
      # 统计 / 分组这类查询的内存临时表（默认 16M，超了落到磁盘上做）
      - --tmp-table-size=${MYSQL_TMP_TABLE:-256M}
      - --max-heap-table-size=${MYSQL_TMP_TABLE:-256M}
      # 慢查询记下来（超过 2 秒）：卡过之后能查到是哪条，在 mysql 容器里 /var/lib/mysql/slow.log
      - --slow-query-log=ON
      - --long-query-time=${MYSQL_SLOW_SEC:-2}
      - --slow-query-log-file=/var/lib/mysql/slow.log
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [smart-label]

  # 数据库迁移单独跑一次性容器：api 和 scheduler 都等它跑完再起，
  # 避免两个容器同时执行迁移打架，也避免忘记手动执行迁移导致表结构对不上
  # （之前就是没有这一步，加了新表/新字段之后线上直接 ProgrammingError）。
  # 后端镜像只在这里 build 一次（打成 smart-label-backend），api / scheduler 直接用同一个镜像。
  # 原来三个 service 各写一遍 build，compose 并行起三次构建，apt / pip 那几层各跑各的。
  migrate:
    build:
      context: ../backend
      args:
        # 国内机器走镜像站快得多；要换回官方就在 .env 里写 APT_MIRROR=deb.debian.org 等
        APT_MIRROR: ${APT_MIRROR:-mirrors.tuna.tsinghua.edu.cn}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    image: smart-label-backend:latest
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    env_file: .env
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MYSQL_DSN: mysql+asyncmy://${MYSQL_USER:-smart_label}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-smart_label}
    command: alembic upgrade head
    networks: [smart-label]

  # 后端主实例。更新不打断别人用：up.sh 先换下面的备用实例 api_b、等它好了再重启这个，
  # 这个重启的那几秒 nginx 自动把请求转给 api_b（见 frontend/nginx/default.conf）
  api: &api_service
    image: smart-label-backend:latest
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8283/health', timeout=3).read()"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 90s
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file: .env
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MYSQL_DSN: mysql+asyncmy://${MYSQL_USER:-smart_label}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-smart_label}
      # imu_train/label_service（AI 推理/训练服务），跟本服务在同一台机器上，
      # 容器内不能用 localhost，所以写宿主机内网 IP。.env 里设了会覆盖这里。
      ALGO_SERVICE_URL: ${ALGO_SERVICE_URL:-http://192.168.2.140:8383}
      # imu_train/vision_service（SAM 辅助标注），跟上面是两个服务两个端口。
      # 给默认值是为了「git pull && bash up.sh」就能用：现成的 .env 是照
      # .env.example 抄的，那一行是空的，要每台机器手填一次才开得了 SAM，
      # 忘了填就只看到按钮灰着、看不出为什么。
      #
      # 用 :- 而不是 -：.env 里那行是空字符串，只有 :- 才会落到默认值上。
      # 代价是没法再用「设成空」来关掉 SAM——所以给了 off 这个显式开关，
      # 见 vision_sam_client.enabled()。
      VISION_SERVICE_URL: ${VISION_SERVICE_URL:-http://192.168.2.140:8385}
      VISION_INDEX_CONCURRENCY: ${VISION_INDEX_CONCURRENCY:-12}
      # algo_tinyml/edge_service（端侧推理，跑的是烧进项圈的那份 C），
      # 用来在模型对比里回答"这个模型上板之后会是什么效果"。
      # 跟上面两个是三个服务三个端口（8383 / 8385 / 8900）。
      #
      # 跟 VISION 一样给默认地址，理由也一样：「git pull && bash up.sh」就能用，
      # 不用每台机器手填一次。服务没起的时候版本下拉里那一组是空的、
      # 旁边给个小提示，别的功能一概不受影响。
      #
      # 这里必须显式列出来。compose 不会自动把 .env 里的变量透进容器——
      # 只往 .env 加一行的话，后端读到的还是空字符串，端侧那组选项不出现，
      # 而且没有任何报错。
      #
      # 用 :- 而不是 -：.env 里那行是空字符串，只有 :- 才会落到默认值上。
      # 要显式关掉：填 off（见 edge_client.enabled()）。
      EDGE_SERVICE_URL: ${EDGE_SERVICE_URL:-http://192.168.2.140:8900}
    ports:
      - "${BACKEND_PORT:-8283}:8283"
    volumes:
      - ${NAS_ROOT_HOST:-/home/toky/ai_data}:${NAS_ROOT:-/home/toky/ai_data}
      # 算法任务素材库（另一个 NAS 共享，牙齿/口腔照片），只读；跟 label_service 的 MATERIAL_ROOT 同一目录
      - ${MATERIAL_ROOT_HOST:-/home/toky/alg_material}:${MATERIAL_ROOT:-/home/toky/alg_material}:ro
      # 日志落到宿主机仓库根目录 logs/smart-label/（api.log / access.log），不用进容器看
      - ../../logs/smart-label:/app/logs
    command: uvicorn app.main:app --host 0.0.0.0 --port 8283
    networks: [smart-label]

  # 备用实例：跟 api 一模一样（同一个镜像、同样的配置），平时不接请求，
  # 只在 api 重启 / 挂掉的那几秒顶上。不对外开端口；日志单独一个目录（两个进程滚同一个日志文件会打架）
  api_b:
    <<: *api_service
    ports: []
    volumes:
      - ${NAS_ROOT_HOST:-/home/toky/ai_data}:${NAS_ROOT:-/home/toky/ai_data}
      - ${MATERIAL_ROOT_HOST:-/home/toky/alg_material}:${MATERIAL_ROOT:-/home/toky/alg_material}:ro
      - ../../logs/smart-label/api_b:/app/logs

  scheduler:
    image: smart-label-backend:latest
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file: .env
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MYSQL_DSN: mysql+asyncmy://${MYSQL_USER:-smart_label}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-smart_label}
    volumes:
      # 自动扫描 NAS 新样本跑在这个容器里，NAS 必须跟 api 一样挂进来——之前漏了，
      # 扫描每 10 分钟对着一个不存在的目录跑，永远扫不到新数据
      - ${NAS_ROOT_HOST:-/home/toky/ai_data}:${NAS_ROOT:-/home/toky/ai_data}
      - ../../logs/smart-label:/app/logs
    # 超时回收定时任务必须只跑一个实例，不要 scale 这个 service
    command: python -m app.workers.scheduler
    networks: [smart-label]

  # 前端：nginx 只管发文件，网页文件放在 web_dist 卷里。更新时 up.sh 把新打包的文件拷进卷、
  # nginx 平滑重载——容器不重建，正在用的人不会断；老版本的 js 留 7 天，开着旧页面的人点到别的页也不白屏
  frontend:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    depends_on:
      - api
    ports:
      - "${FRONTEND_PORT:-8284}:8284"
      # 视频流单独一个端口：同源 6 个连接都被循环播放的视频占着时，接口请求会排队。
      # 见 frontend/nginx/default.conf 里 8285 那个 server（前端 media.ts 也跟着走这个端口）
      - "${MEDIA_PORT:-8285}:8285"
    volumes:
      - web_dist:/usr/share/nginx/html
      # 挂整个目录而不是单个文件：git pull 换文件时是新文件替换旧文件，单文件挂载的话容器里还是旧的
      - ../frontend/nginx:/etc/nginx/conf.d:ro
    networks: [smart-label]

  # 只用来打包前端（up.sh 里 build 一下、把文件拷进 web_dist），平时不运行
  web_build:
    build:
      context: ../frontend
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    image: smart-label-web:latest
    profiles: ["build"]

volumes:
  mysql_data:
  # 名字写死：up.sh 要用 docker run 往里拷前端文件
  web_dist:
    name: smart-label-web-dist

networks:
  smart-label:
