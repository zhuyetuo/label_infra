services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-smart_label}
      MYSQL_USER: ${MYSQL_USER:-smart_label}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [smart-label]

  # 数据库迁移单独跑一次性容器：api 和 scheduler 都等它跑完再起，
  # 避免两个容器同时执行迁移打架，也避免忘记手动执行迁移导致表结构对不上
  # （之前就是没有这一步，加了新表/新字段之后线上直接 ProgrammingError）。
  migrate:
    build:
      context: ../backend
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    env_file: .env
    environment:
      MYSQL_DSN: mysql+asyncmy://${MYSQL_USER:-smart_label}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-smart_label}
    command: alembic upgrade head
    networks: [smart-label]

  api:
    build:
      context: ../backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file: .env
    environment:
      MYSQL_DSN: mysql+asyncmy://${MYSQL_USER:-smart_label}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-smart_label}
      # imu_train/label_service（AI 推理/训练服务），跟本服务在同一台机器上，
      # 容器内不能用 localhost，所以写宿主机内网 IP。.env 里设了会覆盖这里。
      ALGO_SERVICE_URL: ${ALGO_SERVICE_URL:-http://192.168.2.140:8383}
    ports:
      - "${BACKEND_PORT:-8283}:8283"
    volumes:
      - ${NAS_ROOT_HOST:-/home/toky/ai_data}:${NAS_ROOT:-/home/toky/ai_data}
      # 算法任务素材库（另一个 NAS 共享，牙齿/口腔照片），只读；跟 label_service 的 MATERIAL_ROOT 同一目录
      - ${MATERIAL_ROOT_HOST:-/home/toky/alg_material}:${MATERIAL_ROOT:-/home/toky/alg_material}:ro
      # 日志落到宿主机仓库根目录 logs/smart-label/（api.log / access.log），不用进容器看
      - ../../logs/smart-label:/app/logs
    command: uvicorn app.main:app --host 0.0.0.0 --port 8283
    networks: [smart-label]

  scheduler:
    build:
      context: ../backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file: .env
    environment:
      MYSQL_DSN: mysql+asyncmy://${MYSQL_USER:-smart_label}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-smart_label}
    volumes:
      # 自动扫描 NAS 新样本跑在这个容器里，NAS 必须跟 api 一样挂进来——之前漏了，
      # 扫描每 10 分钟对着一个不存在的目录跑，永远扫不到新数据
      - ${NAS_ROOT_HOST:-/home/toky/ai_data}:${NAS_ROOT:-/home/toky/ai_data}
      - ../../logs/smart-label:/app/logs
    # 超时回收定时任务必须只跑一个实例，不要 scale 这个 service
    command: python -m app.workers.scheduler
    networks: [smart-label]

  frontend:
    build:
      context: ../frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${FRONTEND_PORT:-8284}:8284"
    networks: [smart-label]

volumes:
  mysql_data:

networks:
  smart-label:
